<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Horas</title>
<meta name="theme-color" content="#0B2E6B">
<meta name="description" content="Registro y cálculo de horas nocturnas, extra y festivos.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#EEF3FB;
    --white:#FFFFFF;
    --ink:#0F1B33;
    --ink-soft:#5B6B87;
    --blue-900:#0B2E6B;
    --blue-800:#123B84;
    --blue-700:#1D4ED8;
    --blue-600:#2563EB;
    --blue-500:#3B82F6;
    --blue-300:#93C5FD;
    --blue-200:#BFDBFE;
    --blue-100:#DBEAFE;
    --blue-50:#F0F6FF;
    --sky:#0EA5E9;
    --sky-soft:#E0F4FE;
    --deep:#1E3A8A;
    --deep-soft:#E2E9FB;
    --rule:#DCE6F5;
    --rule-strong:#B9CCEB;
    --ok:#1E7A4C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Space Grotesk','Inter',sans-serif;
    font-weight:600;
    margin:0;
    color:var(--blue-900);
    letter-spacing:-.01em;
  }
  .tabular{font-variant-numeric:tabular-nums;}
  .num{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}

  /* ---- shell ---- */
  html,body{background:#B7C4DE;}
  #app{
    max-width:430px;width:100%;margin:0 auto;padding:12px 12px 60px;
    background:var(--bg);min-height:100vh;
  }
  @media(min-width:600px){
    body{padding:28px 0;}
    #app{
      min-height:calc(100vh - 56px);
      border-radius:32px;
      box-shadow:0 24px 60px rgba(11,46,107,.35), 0 0 0 1px rgba(255,255,255,.5);
      overflow:hidden;
    }
  }

  /* ---- app bar (estilo app móvil) ---- */
  .appbar{
    background:linear-gradient(120deg,var(--blue-900),var(--blue-700));
    border-radius:16px;padding:10px 10px 8px;margin-bottom:14px;
    box-shadow:0 8px 22px rgba(11,46,107,.22);
  }
  .appbar-top{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px;}
  .appbar-top .brand{color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;}
  .appbar-top .brand b{color:var(--blue-200);}
  .save-status{font-size:.76rem;color:#fff;font-family:'Inter',sans-serif;font-weight:600;display:flex;align-items:center;}
  .save-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;background:#6EE7B7;flex-shrink:0;}
  .save-dot.saving{background:#FCD34D;animation:pulse-dot 1s ease-in-out infinite;}
  .save-dot.ok{background:#6EE7B7;}
  .save-dot.error{background:#F87171;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
  .appbar-tabs{display:flex;gap:4px;background:rgba(255,255,255,.10);border-radius:13px;padding:4px;}
  .appbar-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;
    border-radius:10px;cursor:pointer;color:rgba(255,255,255,.78);font-size:.64rem;font-weight:600;
    transition:background .15s,color .15s;user-select:none;
  }
  .appbar-tab svg{width:19px;height:19px;}
  .appbar-tab.active{background:#fff;color:var(--blue-800);box-shadow:0 3px 8px rgba(11,46,107,.22);}
  .appbar-tab:not(.active):hover{background:rgba(255,255,255,.10);color:#fff;}

  /* ---- card ---- */
  .card{
    background:var(--white);
    border:1px solid var(--rule);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(15,27,51,.04);
  }
  .card.compact{padding:10px 14px;}
  .card h2{font-size:1.02rem;margin-bottom:10px;}
  .card h3{font-size:.85rem;margin-bottom:8px;color:var(--blue-800);font-weight:700;}
  .grid{display:grid;gap:10px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-4{grid-template-columns:1fr 1fr;}

  label{display:block;font-size:.68rem;color:var(--ink-soft);margin-bottom:3px;font-weight:500;}
  input[type=text],input[type=date],input[type=time],input[type=number],select{
    width:100%;padding:7px 9px;border:1px solid var(--rule-strong);border-radius:7px;
    background:var(--blue-50);font-family:'Inter',sans-serif;font-size:.85rem;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--blue-500);outline-offset:1px;background:#fff;}
  .field{margin-bottom:2px;}

  /* ---- stat cards (estilo "Tiempo / Importe" de la app de referencia) ---- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .stat-grid.cols-4{grid-template-columns:1fr 1fr;}
  .stat-card{
    background:var(--white);border:1px solid var(--rule);border-radius:16px;
    padding:16px 14px;box-shadow:0 2px 6px rgba(15,27,51,.05);
  }
  .stat-card .stat-label{font-size:.7rem;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-card .stat-value{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:var(--blue-900);}
  .stat-card .stat-value.accent{color:var(--blue-600);}
  .stat-card .stat-sub{font-size:.66rem;color:var(--ink-soft);margin-top:3px;}

  /* ---- month pills ---- */
  .month-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch;}
  .month-pill{
    flex:0 0 auto;padding:7px 15px;border-radius:20px;background:#fff;border:1px solid var(--rule-strong);
    color:var(--ink-soft);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .month-pill.active{background:var(--blue-700);color:#fff;border-color:var(--blue-700);}
  .month-pill.anual{border-color:var(--blue-300);color:var(--blue-700);}
  .month-pill.anual.active{background:var(--blue-900);border-color:var(--blue-900);color:#fff;}

  /* ---- lista de días (sin scroll horizontal) ---- */
  .day-list{display:flex;flex-direction:column;}
  .week-label{
    font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:700;color:var(--blue-700);
    text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--rule-strong);
  }
  .week-label:first-child{margin-top:0;padding-top:0;border-top:none;}
  .day-block{padding:9px 10px;border-bottom:1px solid var(--rule);border-radius:8px;margin-bottom:2px;}
  .day-block.festivo{background:var(--sky-soft);}
  .day-block.special{background:var(--deep-soft);}
  .day-head{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:8px;}
  .turno-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .turno-row:last-child{margin-bottom:0;}
  .turno-label{width:54px;flex-shrink:0;font-size:.7rem;color:var(--ink-soft);font-weight:600;}
  .turno-row input[type=time]{flex:1 1 0;min-width:0;padding:8px 8px;font-size:.92rem;font-weight:600;font-family:'JetBrains Mono',monospace;border-radius:8px;color:var(--blue-900);}
  .turno-row input[type=time]:focus{background:var(--blue-100);}
  .turno-sep{color:var(--rule-strong);font-size:.8rem;flex-shrink:0;}

  /* ---- filas de detalle con chips (Cálculos) ---- */
  .detail-row{padding:8px 2px;border-bottom:1px solid var(--rule);}
  .detail-head{font-size:.78rem;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .detail-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .stat-chip{
    display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;
    padding:4px 9px;border-radius:7px;background:var(--blue-50);min-width:64px;
  }
  .stat-chip .k{font-size:.6rem;color:var(--ink-soft);font-weight:500;}
  .stat-chip .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.8rem;color:var(--blue-900);}
  .stat-chip.night{background:var(--sky-soft);}
  .stat-chip.night .v{color:var(--sky);}
  .stat-chip.extra{background:var(--deep-soft);}
  .stat-chip.extra .v{color:var(--deep);}
  .stat-chip.over9{background:#FEE2E2;}
  .stat-chip.over9 .v{color:#B91C1C;}
  .detail-row.over9{background:#FEF2F2;border-radius:8px;border-left:3px solid #B91C1C;padding-left:9px;}
  .tag.over9{background:#B91C1C;color:#fff;}

  /* ---- tabla genérica (legado, ya sin uso en vistas móviles principales) ---- */
  .card.registro{
    border:1.5px solid var(--blue-300);
    box-shadow:0 8px 24px rgba(29,78,216,.10);
    padding:16px 18px;
  }
  .card.registro h3{
    font-family:'Space Grotesk',sans-serif;font-size:1.1rem;color:var(--blue-900);
    display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  }
  .card.registro h3 .month-badge{
    background:var(--blue-700);color:#fff;font-size:.68rem;font-weight:600;
    padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;
  }
  .table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;}
  table.days{border-collapse:collapse;width:100%;min-width:780px;font-size:.85rem;}
  table.days th{
    background:var(--blue-900);color:#fff;font-weight:600;text-align:left;
    padding:9px 10px;position:sticky;top:0;font-family:'Inter',sans-serif;font-size:.68rem;
    text-transform:uppercase;letter-spacing:.04em;
  }
  table.days td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;}
  table.days tr.day-first td{border-top:1px solid var(--rule-strong);}
  table.days tr.festivo{background:var(--sky-soft);}
  table.days tr.special{background:var(--deep-soft);}
  table.days tr:hover{background:var(--blue-50);}
  table.days input[type=time]{width:92px;padding:4px 6px;font-size:.8rem;}
  table.days.simple td{padding:10px 12px;}
  table.days.simple th{padding:11px 12px;font-size:.72rem;}
  table.days.simple input[type=time]{width:120px;padding:9px 10px;font-size:1rem;font-weight:600;font-family:'JetBrains Mono',monospace;border-radius:8px;color:var(--blue-900);}
  table.days.simple input[type=time]:focus{background:var(--blue-100);}
  .tag{font-size:.6rem;padding:2px 6px;border-radius:20px;font-family:'Inter',sans-serif;font-weight:600;margin-left:4px;}
  .tag.festivo{background:var(--sky);color:#fff;}
  .tag.special{background:var(--deep);color:#fff;}
  tr.week-summary td{
    background:var(--blue-50);font-family:'JetBrains Mono',monospace;font-size:.74rem;
    color:var(--blue-800);border-bottom:2px solid var(--rule-strong);padding:6px 10px;font-weight:500;
  }
  td.val{font-family:'JetBrains Mono',monospace;text-align:right;}
  td.extra-val{color:var(--blue-900);font-weight:700;}
  td.night-val{color:var(--sky);font-weight:700;}

  /* ---- totals row ---- */
  .totals-strip{
    display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;
    background:linear-gradient(120deg,var(--blue-900),var(--blue-700));color:#fff;border-radius:10px;
    font-family:'JetBrains Mono',monospace;font-size:.76rem;
  }
  .totals-strip b{display:block;font-size:1.15rem;font-family:'Space Grotesk',sans-serif;}
  .totals-strip .item{min-width:100px;}

  /* ---- ausencias list ---- */
  .aus-row{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;margin-bottom:6px;align-items:end;}
  .btn{
    padding:7px 14px;border:1px solid var(--blue-700);background:var(--blue-700);color:#fff;
    border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn.ghost{background:transparent;color:var(--blue-700);}
  .btn.small{padding:4px 8px;font-size:.7rem;border-radius:6px;}
  .btn.danger{background:#B91C1C;border-color:#B91C1C;}
  .btn.wide{width:100%;padding:11px;font-size:.9rem;margin-top:10px;}

  /* ---- festivos list ---- */
  .fest-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:.8rem;}
  .fest-item .date{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);width:130px;}
  .fest-item .status{margin-left:auto;font-size:.7rem;font-weight:600;}
  .fest-item .status.trabajado{color:var(--ok);}
  .fest-item .status.libre{color:var(--ink-soft);font-weight:400;}

  /* ---- money box ---- */
  .money-grid{display:grid;grid-template-columns:1fr;gap:14px;}
  table.money{width:100%;border-collapse:collapse;font-size:.8rem;}
  table.money td{padding:4px 2px;border-bottom:1px solid var(--rule);}
  table.money td:last-child{text-align:right;font-family:'JetBrains Mono',monospace;}
  table.money tr.total td{font-weight:700;border-top:2px solid var(--blue-700);border-bottom:none;padding-top:7px;color:var(--blue-900);}
  .fpn-result{display:flex;gap:14px;margin-top:8px;}
  .fpn-box{flex:1;padding:10px;border-radius:10px;text-align:center;}
  .fpn-box.desc{background:var(--deep-soft);}
  .fpn-box.sobra{background:var(--sky-soft);}
  .fpn-box b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.2rem;margin-top:2px;color:var(--blue-900);}

  /* ---- distribución de jornadas ---- */
  .dist-donut-wrap{display:flex;justify-content:center;margin-bottom:14px;}
  .dist-donut{width:150px;height:150px;border-radius:50%;position:relative;flex-shrink:0;box-shadow:0 2px 10px rgba(15,27,51,.10);}
  .dist-donut-hole{position:absolute;inset:24px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--rule);}
  .dist-donut-hole b{font-family:'Space Grotesk',sans-serif;font-size:1.35rem;color:var(--blue-900);line-height:1.1;}
  .dist-donut-hole span{font-size:.62rem;color:var(--ink-soft);font-weight:600;}
  .dist-legend{display:flex;flex-direction:column;gap:7px;}
  .dist-row{display:flex;align-items:center;gap:8px;font-size:.78rem;}
  .dist-row .swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .dist-row .lbl{flex:1;color:var(--ink);}
  .dist-row .pct{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--blue-900);width:48px;text-align:right;}
  .dist-row .cnt{font-family:'JetBrains Mono',monospace;color:var(--ink-soft);font-size:.7rem;width:56px;text-align:right;}
  .dist-max{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--deep-soft);display:flex;justify-content:space-between;align-items:center;font-size:.8rem;}
  .dist-max b{font-family:'Space Grotesk',sans-serif;font-size:1.05rem;color:var(--blue-900);}
  .dist-max.warn{background:#FEE2E2;}
  .dist-max.warn b{color:#B91C1C;}
  .descanso-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .descanso-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.72rem;background:#FEF2F2;border-radius:8px;padding:6px 10px;border-left:3px solid #B91C1C;}
  .descanso-row .d-dates{color:var(--ink);}
  .descanso-row .d-rest{font-family:'JetBrains Mono',monospace;font-weight:700;color:#B91C1C;flex-shrink:0;}

  /* ---- resumen ---- */
  table.resumen{width:100%;border-collapse:collapse;font-size:.82rem;}
  table.resumen th{background:var(--blue-900);color:#fff;padding:8px 10px;text-align:left;font-size:.68rem;text-transform:uppercase;font-family:'Inter',sans-serif;letter-spacing:.03em;}
  table.resumen td{padding:7px 10px;border-bottom:1px solid var(--rule);font-family:'JetBrains Mono',monospace;text-align:right;}
  table.resumen td:first-child{text-align:left;font-family:'Inter',sans-serif;font-weight:500;}
  table.resumen tr.total-row td{font-weight:700;border-top:2px solid var(--blue-700);color:var(--blue-900);}
  .chart-wrap{margin-top:16px;}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .bar-label{width:82px;font-size:.72rem;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);}
  .bar-track{flex:1;height:16px;background:var(--blue-50);border:1px solid var(--rule);border-radius:20px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:var(--blue-500);}
  .bar-fill.over{background:var(--blue-900);}
  .bar-val{width:110px;font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--ink-soft);text-align:right;}

  /* ---- informes ---- */
  .report-icon{width:34px;height:34px;border-radius:9px;background:var(--blue-100);color:var(--blue-700);display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
  .report-icon svg{width:18px;height:18px;}

  .hint{font-size:.72rem;color:var(--ink-soft);line-height:1.4;margin-top:2px;}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando datos guardados…</div></div>

<script>
/* ============ DATOS BASE ============ */
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const WEEKDAY_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const YEARS = [2025,2026,2027,2028,2029,2030,2031,2032,2033,2034,2035];

/* ---- calendario semanal por año (10 meses de 4 semanas + 2 meses de 6 semanas = 52 semanas) ---- */
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function mondayOnOrBefore(d){
  const wd = (d.getDay()+6)%7; // lunes=0 ... domingo=6
  const r = new Date(d); r.setDate(d.getDate()-wd); return r;
}
function addWeeks(d,w){ const r=new Date(d); r.setDate(d.getDate()+w*7); return r; }

const MONTHS_META_CACHE = {};
function computeMonthsMeta(year){
  let cursor = mondayOnOrBefore(new Date(year,0,1));
  let sixUsed = 0, weekCounter = 1;
  const periods = [];
  for(let m=1;m<=12;m++){
    const targetNext = m===12 ? new Date(year+1,0,1) : new Date(year,m,1);
    const periodsLeftInclThis = 13-m;
    const sixLeft = 2-sixUsed;
    const forceSix = sixLeft>0 && (periodsLeftInclThis-1) < sixLeft;
    let weeks;
    if(forceSix){ weeks=6; }
    else{
      const fourEnd = addWeeks(cursor,4), sixEnd = addWeeks(cursor,6);
      const drift4 = Math.abs(fourEnd-targetNext), drift6 = Math.abs(sixEnd-targetNext);
      weeks = (sixLeft>0 && drift6<drift4) ? 6 : 4;
    }
    periods.push({name:MONTH_NAMES[m-1], start:isoDate(cursor), weeks, startWeek:weekCounter});
    weekCounter += weeks;
    if(weeks===6) sixUsed++;
    cursor = addWeeks(cursor,weeks);
  }
  return periods;
}
function getMonthsMeta(year){
  if(!MONTHS_META_CACHE[year]) MONTHS_META_CACHE[year] = computeMonthsMeta(year);
  return MONTHS_META_CACHE[year];
}

/* ---- festivos por año (fechas fijas + Jueves/Viernes Santo calculados con Pascua) ---- */
function easterDate(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
    g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
    mm=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*mm+114)/31),day=((h+l-7*mm+114)%31)+1;
  return new Date(year, month-1, day);
}
const FESTIVOS_CACHE = {};
function computeFestivos(year){
  const easter = easterDate(year);
  const juevesSanto = new Date(easter); juevesSanto.setDate(easter.getDate()-3);
  const viernesSanto = new Date(easter); viernesSanto.setDate(easter.getDate()-2);
  const names = {};
  names[`${year}-01-01`]='Año Nuevo';
  names[`${year}-01-06`]='Reyes';
  names[`${year}-02-17`]='Festivo local';
  names[`${year}-03-19`]='San José';
  names[isoDate(juevesSanto)]='Jueves Santo';
  names[isoDate(viernesSanto)]='Viernes Santo';
  names[`${year}-05-01`]='Día del Trabajo';
  names[`${year}-06-24`]='San Juan';
  names[`${year}-07-25`]='Santiago Apóstol';
  names[`${year}-08-15`]='Asunción';
  names[`${year}-10-07`]='Festivo local';
  names[`${year}-10-12`]='Fiesta Nacional';
  names[`${year}-12-08`]='Inmaculada';
  names[`${year}-12-25`]='Navidad';
  return {list:Object.keys(names).sort(), names};
}
function getFestivos(year){
  if(!FESTIVOS_CACHE[year]) FESTIVOS_CACHE[year] = computeFestivos(year);
  return FESTIVOS_CACHE[year];
}

const DEFAULT_STATE = {
  employee:{nombre:'', dni:'', empresa:'', cif:''},
  config:{
    nightStart:22, nightEnd:6, jornadaNormal:8, umbralExtra:9, descansoMinimo:12,
    precioNormal:12.48, precioExtra:18.72, precioNocturna:2.53,
    fpnBase:80, limiteAnual:1780, limiteExtraAnual:40
  },
  year:2026,

};

let STATE = null;

/* Precios que suben cada año (festivo y pernocta): por defecto se calculan
   a partir de 2026 (34€ festivo, 75€ pernocta) sumando 2€/5€ por cada año
   de diferencia, pero el usuario puede sobreescribir el valor de un año
   concreto desde Ajustes, y ese valor manual queda fijo para ese año. */
function getYearPrices(year){
  const y = String(year);
  if(!STATE.pricesByYear) STATE.pricesByYear = {};
  const stored = STATE.pricesByYear[y] || {};
  const base = Number(year) - 2026;
  const defFestivo = 34 + base*2;
  const defPernocta = 75 + base*5;
  return {
    precioFestivo: (stored.precioFestivo!==undefined && stored.precioFestivo!==null && stored.precioFestivo!=='') ? Number(stored.precioFestivo) : defFestivo,
    precioPernocta: (stored.precioPernocta!==undefined && stored.precioPernocta!==null && stored.precioPernocta!=='') ? Number(stored.precioPernocta) : defPernocta,
  };
}
function setYearPrice(year, key, value){
  const y = String(year);
  if(!STATE.pricesByYear) STATE.pricesByYear = {};
  if(!STATE.pricesByYear[y]) STATE.pricesByYear[y] = {};
  STATE.pricesByYear[y][key] = value;
}
function calcPernoctaNoches(monthData){
  return (monthData.pernoctas||[]).reduce((sum,p)=>{
    if(!p.desde || !p.hasta) return sum;
    const nights = Math.round((new Date(p.hasta+'T00:00:00') - new Date(p.desde+'T00:00:00'))/86400000);
    return sum + Math.max(0,nights);
  },0);
}

function getMonthData(year, monthName){
  const y = String(year);
  if(!STATE.monthsByYear[y]) STATE.monthsByYear[y] = {};
  if(!STATE.monthsByYear[y][monthName]) STATE.monthsByYear[y][monthName] = {vacaciones:{desde:'',hasta:''}, ausencias:[], pernoctas:[], days:{}, abonado:0};
  if(STATE.monthsByYear[y][monthName].abonado===undefined) STATE.monthsByYear[y][monthName].abonado = 0;
  if(!STATE.monthsByYear[y][monthName].pernoctas) STATE.monthsByYear[y][monthName].pernoctas = [];
  return STATE.monthsByYear[y][monthName];
}
function nextMonthName(monthName){
  const idx = MONTH_NAMES.indexOf(monthName);
  return MONTH_NAMES[(idx+1)%12];
}
/* Encuentra a qué (año, mes-de-la-app) pertenece una fecha ISO cualquiera.
   Los "meses" de la app no son meses de calendario exactos (empiezan en
   lunes y duran 4 o 6 semanas), así que hay que buscarlo en los periodos
   generados, probando también el año anterior/siguiente por si la fecha
   cae en un periodo que arranca a caballo entre dos años. */
function findMonthForISO(iso){
  const y = parseInt(iso.slice(0,4),10);
  for(const year of [y, y-1, y+1]){
    const metas = getMonthsMeta(year);
    for(const meta of metas){
      if(genDays(meta).includes(iso)) return {year, monthName:meta.name, meta};
    }
  }
  return null;
}
/* Calcula horas/importes para un rango de fechas arbitrario (puede abarcar
   varios "meses" de la app). No incluye descuento FPN ni horas abonadas:
   esos conceptos son por periodo mensual completo (ver informe anual o el
   detalle de cada mes en Cálculos). */
function calcRange(desde, hasta){
  const cfg = STATE.config;
  const rows = [];
  let totG=0,totH=0,totI=0,totJ=0,festivosTrabajados=0,importeFestivos=0;
  const gValues = [];
  const festCache = {};
  const monthsSeen = new Set();
  let pernoctaNoches = 0, importePernocta = 0;
  let cursor = new Date(desde+'T00:00:00');
  const end = new Date(hasta+'T00:00:00');
  while(cursor<=end){
    const iso = isoDate(cursor);
    const found = findMonthForISO(iso);
    if(found){
      const monthData = getMonthData(found.year, found.monthName);
      const yearPrices = getYearPrices(found.year);
      const d = calcDay(iso, monthData, cfg);
      if(d.G!==null){
        totG+=d.G; totH+=d.H; totI+=d.I; totJ+=d.J;
        if(!d.special) gValues.push(d.G);
        if(!festCache[found.year]) festCache[found.year] = getFestivos(found.year);
        if(festCache[found.year].list.includes(iso)){
          const dcell = monthData.days[iso];
          if(dcell && ((dcell.M&&dcell.M.entrada)||(dcell.T&&dcell.T.entrada))){
            festivosTrabajados++;
            importeFestivos += yearPrices.precioFestivo;
          }
        }
        rows.push({iso, d, monthData});
      }
      const monthKey = found.year+'|'+found.monthName;
      if(!monthsSeen.has(monthKey)){
        monthsSeen.add(monthKey);
        (monthData.pernoctas||[]).forEach(p=>{
          if(p.desde && p.hasta && p.desde>=desde && p.hasta<=hasta){
            const nights = Math.round((new Date(p.hasta+'T00:00:00') - new Date(p.desde+'T00:00:00'))/86400000);
            if(nights>0){ pernoctaNoches += nights; importePernocta += nights*yearPrices.precioPernocta; }
          }
        });
      }
    }
    cursor.setDate(cursor.getDate()+1);
  }
  const importeExtra = totJ*cfg.precioExtra;
  const importeNocturna = totH*cfg.precioNocturna;
  const totalAPercibir = importeExtra+importeNocturna;
  return {rows, totG,totH,totI,totJ, festivosTrabajados, importeExtra, importeNocturna, totalAPercibir, importeFestivos,
    pernoctaNoches, importePernocta, gValues, descansos: calcDescansos(rows, cfg)};
}

/* ============ PERSISTENCIA ============ */
/* Usa window.storage cuando la app corre dentro de Claude (para poder seguir
   probándola aquí), y localStorage del navegador en cualquier otro sitio:
   Chrome, Safari, o ya empaquetada como APK/PWA. Así funciona en ambos casos
   sin tocar nada más. */
const STORAGE_KEY = 'control-horas-2026';
const hasClaudeStorage = (typeof window !== 'undefined') && !!window.storage;
async function storageGet(key){
  if(hasClaudeStorage) return window.storage.get(key, false);
  try{
    const v = localStorage.getItem(key);
    return v!==null ? {key, value:v, shared:false} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasClaudeStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return {key, value, shared:false};
}

async function loadState(){
  try{
    const r = await storageGet(STORAGE_KEY);
    if(r && r.value){
      STATE = mergeDefaults(JSON.parse(r.value));
    } else {
      STATE = structuredClone(DEFAULT_STATE);
    }
  }catch(e){
    STATE = structuredClone(DEFAULT_STATE);
  }
}
function mergeDefaults(parsed){
  const base = structuredClone(DEFAULT_STATE);
  base.employee = Object.assign(base.employee, parsed.employee||{});
  base.config = Object.assign(base.config, parsed.config||{});
  base.year = parsed.year || 2026;
  if(parsed.monthsByYear){
    base.monthsByYear = parsed.monthsByYear;
  } else if(parsed.months){
    // migración desde el formato de un único año (2026)
    base.monthsByYear = {'2026': parsed.months};
    base.year = 2026;
  }
  base.pricesByYear = parsed.pricesByYear || {};
  return base;
}
function queueSave(){
  updateSaveDot('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>attemptSave(0), 500);
}
async function attemptSave(retryCount){
  try{
    await storageSet(STORAGE_KEY, JSON.stringify(STATE));
    updateSaveDot('ok');
  }catch(e){
    if(retryCount<3){
      setTimeout(()=>attemptSave(retryCount+1), 1200);
    } else {
      updateSaveDot('error');
    }
  }
}
function updateSaveDot(state){

/* ============ HELPERS DE FECHA / HORA ============ */
function genDays(meta){
  const days=[];
  const d = new Date(meta.start+'T00:00:00');
  for(let i=0;i<meta.weeks*7;i++){
    const dt = new Date(d); dt.setDate(d.getDate()+i);
    days.push(isoDate(dt));
  }
  return days;
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return `${WEEKDAY_SHORT[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function isWeekday(iso){
  const d = new Date(iso+'T00:00:00');
  const wd = d.getDay();
  return wd>=1 && wd<=5;
}
function inRange(iso,desde,hasta){
  if(!desde||!hasta) return false;
  return iso>=desde && iso<=hasta;
}
function timeToHours(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h + m/60;
}
function overlap(a,b,lo,hi){ return Math.max(0, Math.min(b,hi)-Math.max(a,lo)); }
function nightHours(entrada,salida,cfg){
  const nS = cfg.nightStart, nE = cfg.nightEnd;
  const w1 = overlap(entrada,salida, nS, nE+24);
  const w2 = overlap(entrada,salida, 0, nE);
  return w1+w2;
}
function fmtH(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : v.toFixed(2).replace('.',',')+' h'; }
function hoursToClock(h){
  const hh = Math.floor(((h%24)+24)%24);
  const mm = Math.round((h-Math.floor(h))*60)%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function fmtEUR(v){ return (v===null||v===undefined||isNaN(v)) ? '—' : v.toFixed(2).replace('.',',')+' €'; }

/* ============ MOTOR DE CÁLCULO (replica las fórmulas del Excel) ============ */
function calcRow(iso, turno, monthData, cfg){
  const cell = (monthData.days[iso]||{})[turno] || {};
  const entradaT = timeToHours(cell.entrada);
  const salidaT = timeToHours(cell.salida);
  const vac = monthData.vacaciones;
  const ausencia = monthData.ausencias.find(a=>a.fecha===iso);
  const isSpecialDay = (turno==='M') && !cell.entrada && !cell.salida &&
    ( (inRange(iso,vac.desde,vac.hasta) && isWeekday(iso)) || !!ausencia );

  if(isSpecialDay){
    return {G:cfg.jornadaNormal, H:0, special:true, ausenciaDesc: ausencia?ausencia.desc:null};
  }
  if(entradaT===null || salidaT===null){
    return {G:null,H:null,special:false};
  }
  const F = salidaT < entradaT ? salidaT+24 : salidaT;
  const G = F - entradaT;
  const H = nightHours(entradaT,F,cfg);
  return {G,H,special:false};
}
/* Horas normales/extra calculadas a nivel de DÍA (sumando turno Mañana + Tarde),
   no por turno por separado: así un día partido en dos turnos no "reinicia" el
   umbral de horas extra en cada turno. */
function calcDay(iso, monthData, cfg){
  const rM = calcRow(iso,'M',monthData,cfg);
  const rT = calcRow(iso,'T',monthData,cfg);
  if(rM.special){
    return {G:rM.G, H:0, I:rM.G, J:0, special:true, ausenciaDesc:rM.ausenciaDesc, rM, rT};
  }
  if(rM.G===null && rT.G===null){
    return {G:null,H:null,I:null,J:null,special:false,rM,rT};
  }
  const G = (rM.G||0)+(rT.G||0);
  const H = (rM.H||0)+(rT.H||0);
  const I = Math.min(G, cfg.umbralExtra);
  const J = Math.max(0, G-cfg.umbralExtra);
  return {G,H,I,J,special:false,rM,rT};
}
/* ============ DISTRIBUCIÓN DE JORNADAS ============ */
const DIST_BUCKETS = [
  {label:'Menos de 7h', min:-Infinity, max:7, color:'#94A3B8'},
  {label:'Entre 7h y 8h', min:7, max:8, color:'#60A5FA'},
  {label:'Entre 8h y 9h', min:8, max:9, color:'#22C55E'},
  {label:'Entre 9h y 10h', min:9, max:10, color:'#F59E0B'},
  {label:'Entre 10h y 11h', min:10, max:11, color:'#FB923C'},
  {label:'Entre 11h y 12h', min:11, max:12, color:'#EF4444'},
  {label:'Más de 12h', min:12, max:Infinity, color:'#B91C1C'},
];
function calcJornadaDist(gValues){
  const total = gValues.length;
  const buckets = DIST_BUCKETS.map(b=>{
    const count = gValues.filter(g=> g>=b.min && g<b.max).length;
    return Object.assign({}, b, {count, pct: total? (count/total*100) : 0});
  });
  const max = total ? Math.max(...gValues) : 0;
  return {buckets, total, max};
}

/* ============ DESCANSO ENTRE JORNADAS (12h) ============ */
function getShiftBounds(iso, monthData){
  const cell = monthData.days[iso] || {};
  const m = cell.M || {}, t = cell.T || {};
  const mE = timeToHours(m.entrada), mS = timeToHours(m.salida);
  const tE = timeToHours(t.entrada), tS = timeToHours(t.salida);
  const mEnd = (mE!==null && mS!==null) ? (mS<mE ? mS+24 : mS) : null;
  const tEnd = (tE!==null && tS!==null) ? (tS<tE ? tS+24 : tS) : null;
  return {mStart:mE, mEnd, tStart:tE, tEnd};
}
/* entries: [{iso, monthData, d}] en orden cronológico (d = resultado de calcDay).
   Compara el fin del último turno de un día trabajado con el inicio del
   primer turno del SIGUIENTE día trabajado (salte fines de semana, vacaciones
   o ausencias de por medio: el descanso ahí siempre será mucho mayor a 12h,
   así que no hace falta tratarlos aparte). */
function calcDescansos(entries, cfg){
  const worked = entries.filter(e => e.d && e.d.G!==null && !e.d.special);
  const violations = [];
  for(let i=0;i<worked.length-1;i++){
    const cur = worked[i], nxt = worked[i+1];
    const curB = getShiftBounds(cur.iso, cur.monthData);
    const nxtB = getShiftBounds(nxt.iso, nxt.monthData);
    const lastEnd = curB.tEnd!==null ? curB.tEnd : curB.mEnd;
    const firstStart = nxtB.mStart!==null ? nxtB.mStart : nxtB.tStart;
    if(lastEnd===null || firstStart===null) continue;
    const endTs = new Date(cur.iso+'T00:00:00').getTime() + lastEnd*3600000;
    const startTs = new Date(nxt.iso+'T00:00:00').getTime() + firstStart*3600000;
    const restH = (startTs-endTs)/3600000;
    if(restH < cfg.descansoMinimo){
      const dEndReal = new Date(cur.iso+'T00:00:00'); dEndReal.setDate(dEndReal.getDate()+Math.floor(lastEnd/24));
      violations.push({finIso:isoDate(dEndReal), finHora:lastEnd%24, inicioIso:nxt.iso, inicioHora:firstStart%24, restH});
    }
  }
  return {violations, totalTransiciones: Math.max(0,worked.length-1), count: violations.length,
    pct: worked.length>1 ? (violations.length/(worked.length-1)*100) : 0};
}
function buildMonthEntries(year, monthName, cfg){
  const meta = getMonthsMeta(year).find(m=>m.name===monthName);
  const monthData = getMonthData(year, monthName);
  const days = genDays(meta);
  const entries = days.map(iso=>({iso, monthData, d: calcDay(iso,monthData,cfg)}));
  return {meta, monthData, days, entries};
}
function calcDescansosAnual(year, cfg){
  let allEntries = [];
  getMonthsMeta(year).forEach(m=>{ allEntries = allEntries.concat(buildMonthEntries(year, m.name, cfg).entries); });
  return calcDescansos(allEntries, cfg);
}

function calcMonth(year, monthName){
  const meta = getMonthsMeta(year).find(m=>m.name===monthName);
  const monthData = getMonthData(year, monthName);
  const cfg = STATE.config;
  const yearPrices = getYearPrices(year);
  const days = genDays(meta);
  const FESTIVOS = getFestivos(year).list;
  let totG=0,totH=0,totI=0,totJ=0;
  const gValues = [];
  days.forEach(iso=>{
    const d = calcDay(iso,monthData,cfg);
    if(d.G!==null){
      totG+=d.G; totH+=d.H; totI+=d.I; totJ+=d.J;
      if(!d.special) gValues.push(d.G);
    }
  });
  const festivosMes = FESTIVOS.filter(f=>days.includes(f));
  let festivosTrabajados = 0;
  festivosMes.forEach(f=>{
    const dcell = monthData.days[f];
    if(dcell && ((dcell.M&&dcell.M.entrada)||(dcell.T&&dcell.T.entrada))) festivosTrabajados++;
  });
  const importeExtra = totJ*cfg.precioExtra;
  const importeNocturna = totH*cfg.precioNocturna;
  const totalAPercibir = importeExtra+importeNocturna;
  const importeFestivos = festivosTrabajados*yearPrices.precioFestivo;
  const pernoctaNoches = calcPernoctaNoches(monthData);
  const importePernocta = pernoctaNoches*yearPrices.precioPernocta;
  const descuentoObjetivo = cfg.fpnBase*0.7;
  const descontado = Math.min(descuentoObjetivo, totalAPercibir);
  const totalAPercibirFPN = Math.max(totalAPercibir-descuentoObjetivo,0);
  const abonado = monthData.abonado||0;
  const diferencia = totalAPercibirFPN - abonado;
  const entries = days.map(iso=>({iso, monthData, d: calcDay(iso,monthData,cfg)}));
  return {
    days, totG,totH,totI,totJ, festivosMes, festivosTrabajados, importeExtra, importeNocturna,
    totalAPercibir, importeFestivos, descuentoObjetivo, descontado,
    sobrante: totalAPercibirFPN, totalAPercibirFPN, abonado, diferencia,
    pernoctaNoches, importePernocta, precioPernocta: yearPrices.precioPernocta, precioFestivo: yearPrices.precioFestivo,
    gValues, distribucion: calcJornadaDist(gValues), descansos: calcDescansos(entries, cfg),
    ref: meta.weeks===6?240:160
  };
}

  const tabsEl = document.getElementById('appbar-tabs');
  const defs = [
    {key:'registrar', label:'Registrar', icon:ICONS.registrar},
    {key:'calculos', label:'Cálculos', icon:ICONS.calculos},
    {key:'informes', label:'Informes', icon:ICONS.informes},
    {key:'ajustes', label:'Ajustes', icon:ICONS.ajustes},
  ];
  tabsEl.innerHTML = defs.map(d=>`<div class="appbar-tab ${ACTIVE_SECTION===d.key?'active':''}" data-key="${d.key}">${d.icon}<span>${d.label}</span></div>`).join('');
  tabsEl.querySelectorAll('.appbar-tab').forEach(t=>{
    t.addEventListener('click',()=>{ ACTIVE_SECTION=t.dataset.key; renderAppTabs(); renderContent(); });
  });
}

function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML='';
  if(ACTIVE_SECTION==='registrar') content.appendChild(renderRegistrar());
  else if(ACTIVE_SECTION==='calculos') content.appendChild(renderCalculos());
  else if(ACTIVE_SECTION==='informes') content.appendChild(renderInformes());
  else content.appendChild(renderAjustes());
}

function renderPillSelector(items, active, onSelect, extraClass){
  const wrap = el(`<div class="month-pills"></div>`);
  items.forEach(it=>{
    const p = el(`<div class="month-pill ${it.cls||''} ${active===it.value?'active':''}">${it.label}</div>`);
    p.addEventListener('click', ()=>onSelect(it.value));
    wrap.appendChild(p);
  });
  setTimeout(()=>{
    const activeEl = wrap.querySelector('.month-pill.active');
    if(activeEl && activeEl.scrollIntoView){
      activeEl.scrollIntoView({inline:'center', block:'nearest'});
    }
  },0);
  return wrap;
}
function renderMonthPills(active, onSelect, withAnual){
  const items = getMonthsMeta(STATE.year).map(m=>({value:m.name, label:m.name}));
  if(withAnual) items.push({value:'Anual', label:'Año completo', cls:'anual'});
  return renderPillSelector(items, active, onSelect);
}
function renderYearPills(active, onSelect){
  const items = YEARS.map(y=>({value:y, label:String(y)}));
  return renderPillSelector(items, active, onSelect);
}

/* ================= REGISTRAR ================= */
let SELECTED_DATE = null;
function todayISO(){ return isoDate(new Date()); }

function renderRegistrar(){
  const wrap = document.createElement('div');
  wrap.appendChild(renderMonthPills(ACTIVE_MONTH, m=>{ ACTIVE_MONTH=m; SELECTED_DATE=null; renderContent(); }, false));

  const monthName = ACTIVE_MONTH;
  const meta = getMonthsMeta(STATE.year).find(m=>m.name===monthName);
  const monthData = getMonthData(STATE.year, monthName);
  const cfg = STATE.config;
  const calc = calcMonth(STATE.year, monthName);
  const days = genDays(meta);

  if(!SELECTED_DATE || !days.includes(SELECTED_DATE)){
    SELECTED_DATE = days.includes(todayISO()) ? todayISO() : days[0];
  }
  const iso = SELECTED_DATE;

  wrap.appendChild(el(`<div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Horas registradas</div><div class="stat-value">${fmtH(calc.totI+calc.totJ)}</div><div class="stat-sub">referencia ${calc.ref} h</div></div>
    <div class="stat-card"><div class="stat-label">Importe estimado</div><div class="stat-value accent">${fmtEUR(calc.totalAPercibir)}</div><div class="stat-sub">extra + nocturnas</div></div>
  </div>`));

  const isFest = getFestivos(STATE.year).list.includes(iso);
  const rM = calcRow(iso,'M',monthData,cfg);
  const rT = calcRow(iso,'T',monthData,cfg);
  const cellM = (monthData.days[iso]||{}).M||{};
  const cellT = (monthData.days[iso]||{}).T||{};
  const isSpecial = rM.special || rT.special;
  const dToday = calcDay(iso, monthData, cfg);
  const isOverToday = !isSpecial && dToday.G!==null && dToday.G > cfg.umbralExtra;

  const bodyHtml = isSpecial ? `
    <p class="hint" style="margin-top:10px;">Este día cae dentro de un periodo de vacaciones o una ausencia justificada, así que ya cuenta como jornada normal (${cfg.jornadaNormal} h) sin necesidad de registrar horario.</p>
  ` : `
    <div class="turno-row" style="margin-top:12px;">
      <span class="turno-label">Mañana</span>
      <input type="time" id="in-m-entrada" value="${cellM.entrada||''}">
      <span class="turno-sep">–</span>
      <input type="time" id="in-m-salida" value="${cellM.salida||''}">
    </div>
    <div class="turno-row">
      <span class="turno-label">Tarde</span>
      <input type="time" id="in-t-entrada" value="${cellT.entrada||''}">
      <span class="turno-sep">–</span>
      <input type="time" id="in-t-salida" value="${cellT.salida||''}">
    </div>
    <button class="btn wide" id="btn-day-aceptar">Aceptar</button>
    ${dToday.G!==null?`<p class="hint" style="margin-top:8px;${isOverToday?'color:#B91C1C;font-weight:600;':''}">Total del día: ${fmtH(dToday.G)}${isOverToday?` — supera el umbral de ${cfg.umbralExtra} h (${fmtH(dToday.J)} extra)`:''}</p>`:''}
  `;

  const tableCard = el(`<div class="card registro">
    <h3>Registro diario <span class="month-badge">${monthName} ${STATE.year}</span></h3>
    <div class="field"><label>Día</label><input type="date" id="reg-fecha" value="${iso}" min="${days[0]}" max="${days[days.length-1]}"></div>
    <div class="day-head" style="margin-top:10px;">${fmtDate(iso)}
      ${isFest?`<span class="tag festivo">${getFestivos(STATE.year).names[iso]||'Festivo'}</span>`:''}
      ${isSpecial?`<span class="tag special">${rM.ausenciaDesc||rT.ausenciaDesc?'Ausencia':'Vacaciones'}</span>`:''}
      ${isOverToday?`<span class="tag over9">Supera ${cfg.umbralExtra}h</span>`:''}
    </div>
    ${bodyHtml}
  </div>`);
  wrap.appendChild(tableCard);

  // --- vacaciones + ausencias (secundario, con su propio "Aceptar") ---
  const topRow = el(`<div class="grid cols-2">
    <div class="card compact">
      <h3>Periodo con jornada normal (vacaciones / baja)</h3>
      <div class="grid cols-2">
        <div class="field"><label>Desde</label><input id="vac-desde" type="date" value="${monthData.vacaciones.desde}"></div>
        <div class="field"><label>Hasta</label><input id="vac-hasta" type="date" value="${monthData.vacaciones.hasta}"></div>
      </div>
      <button class="btn small" id="vac-aceptar" style="margin-top:8px;">Aceptar</button>
      <p class="hint">Cada día laborable (L–V) dentro del rango se computa como jornada normal (${cfg.jornadaNormal}h) al pulsar Aceptar.</p>
    </div>
    <div class="card compact" id="aus-card">
      <h3>Ausencias justificadas (+${cfg.jornadaNormal}h cada una)</h3>
      <div id="aus-list"></div>
      <div class="grid cols-2" style="margin-top:6px;">
        <div class="field"><label>Fecha</label><input id="aus-new-fecha" type="date"></div>
        <div class="field"><label>Descripción</label><input id="aus-new-desc" type="text" placeholder="Motivo"></div>
      </div>
      <button class="btn small" id="aus-aceptar" style="margin-top:8px;" ${monthData.ausencias.length>=7?'disabled':''}>Aceptar (máx. 7)</button>
    </div>
  </div>`);
  wrap.appendChild(topRow);

  // --- pernoctas (debajo de vacaciones/ausencias) ---
  const yearPricesReg = getYearPrices(STATE.year);
  const pernoctaCard = el(`<div class="card compact" id="pernocta-card">
    <h3>Pernoctas fuera de casa <span style="font-weight:400;color:var(--ink-soft);">(${fmtEUR(yearPricesReg.precioPernocta)}/noche en ${STATE.year})</span></h3>
    <div id="pernocta-list"></div>
    <div class="grid cols-2" style="margin-top:6px;">
      <div class="field"><label>Desde</label><input id="pernocta-new-desde" type="date"></div>
      <div class="field"><label>Hasta</label><input id="pernocta-new-hasta" type="date"></div>
    </div>
    <button class="btn small" id="pernocta-aceptar" style="margin-top:8px;">Añadir</button>
    <p class="hint">Ej.: del 8 al 10 de septiembre = 2 noches. Cada noche del rango (hasta − desde) se abona al precio configurado en Ajustes para este año.</p>
  </div>`);
  wrap.appendChild(pernoctaCard);

  setTimeout(()=>{
    document.getElementById('reg-fecha').addEventListener('change', e=>{
      if(days.includes(e.target.value)){ SELECTED_DATE = e.target.value; renderContent(); }
    });
    if(!isSpecial){
      document.getElementById('btn-day-aceptar').addEventListener('click', ()=>{
        if(!monthData.days[iso]) monthData.days[iso]={M:{},T:{}};
        monthData.days[iso].M = { entrada:document.getElementById('in-m-entrada').value, salida:document.getElementById('in-m-salida').value };
        monthData.days[iso].T = { entrada:document.getElementById('in-t-entrada').value, salida:document.getElementById('in-t-salida').value };
        queueSave();
        renderContent();
      });
    }
    document.getElementById('vac-aceptar').addEventListener('click', ()=>{
      monthData.vacaciones.desde = document.getElementById('vac-desde').value;
      monthData.vacaciones.hasta = document.getElementById('vac-hasta').value;
      queueSave(); renderContent();
    });
    renderAusencias(monthName);
    document.getElementById('aus-aceptar').addEventListener('click', ()=>{
      const fecha = document.getElementById('aus-new-fecha').value;
      const desc = document.getElementById('aus-new-desc').value;
      if(fecha && monthData.ausencias.length<7){
        monthData.ausencias.push({fecha, desc});
        queueSave(); renderContent();
      }
    });
    renderPernoctas(monthName);
    document.getElementById('pernocta-aceptar').addEventListener('click', ()=>{
      const pdesde = document.getElementById('pernocta-new-desde').value;
      const phasta = document.getElementById('pernocta-new-hasta').value;
      if(pdesde && phasta && phasta>pdesde){
        monthData.pernoctas.push({desde:pdesde, hasta:phasta});
        queueSave(); renderContent();
      }
    });
  },0);

  return wrap;
}

function renderPernoctas(monthName){
  const monthData = getMonthData(STATE.year, monthName);
  const listEl = document.getElementById('pernocta-list');
  listEl.innerHTML='';
  if(monthData.pernoctas.length===0){
    listEl.appendChild(el(`<p class="hint">Sin pernoctas registradas.</p>`));
  }
  monthData.pernoctas.forEach((p,idx)=>{
    const nights = Math.max(0, Math.round((new Date(p.hasta+'T00:00:00') - new Date(p.desde+'T00:00:00'))/86400000));
    const row = el(`<div class="fest-item"><span class="date">${fmtDate(p.desde)} → ${fmtDate(p.hasta)}</span><span>${nights} noche${nights===1?'':'s'}</span>
      <button class="btn small danger" style="margin-left:auto;" title="Eliminar">✕</button></div>`);
    row.querySelector('button').addEventListener('click', ()=>{ monthData.pernoctas.splice(idx,1); queueSave(); renderContent(); });
    listEl.appendChild(row);
  });
}

function renderAusencias(monthName){
  const monthData = getMonthData(STATE.year, monthName);
  const listEl = document.getElementById('aus-list');
  listEl.innerHTML='';
  if(monthData.ausencias.length===0){
    listEl.appendChild(el(`<p class="hint">Sin ausencias registradas.</p>`));
  }
  monthData.ausencias.forEach((a,idx)=>{

      <button class="btn small danger" style="margin-left:auto;" title="Eliminar">✕</button></div>`);
    row.querySelector('button').addEventListener('click', ()=>{ monthData.ausencias.splice(idx,1); queueSave(); renderContent(); });
    listEl.appendChild(row);
  });
}

function renderDetalleDiario(monthName){
  const meta = getMonthsMeta(STATE.year).find(m=>m.name===monthName);
  const monthData = getMonthData(STATE.year, monthName);
  const cfg = STATE.config;
  const FESTIVOS_DATA = getFestivos(STATE.year);
  const FESTIVOS = FESTIVOS_DATA.list;
  const days = genDays(meta);
  let weekNum = meta.startWeek;
  let rowsHtml = '';
  for(let w=0; w<meta.weeks; w++){
    const weekDays = days.slice(w*7,(w*7)+7);
    let weekTotal = 0;
    let weekRows = '';
    weekDays.forEach(iso=>{
      const d = calcDay(iso,monthData,cfg);
      if(d.G===null) return; // sin registro ese día, no ocupa sitio
      weekTotal += d.G;
      const isFest = FESTIVOS.includes(iso);
      const isOver = !d.special && d.G > cfg.umbralExtra;
      const turnoChips = d.special ? '' : [
        (d.rM && d.rM.G!==null) ? `<span class="stat-chip"><span class="k">Mañana</span><span class="v">${fmtH(d.rM.G)}</span></span>` : '',
        (d.rT && d.rT.G!==null) ? `<span class="stat-chip"><span class="k">Tarde</span><span class="v">${fmtH(d.rT.G)}</span></span>` : ''
      ].join('');
      weekRows += `<div class="detail-row${isOver?' over9':''}">
        <div class="detail-head">${fmtDate(iso)}
          ${isFest?`<span class="tag festivo">${FESTIVOS_DATA.names[iso]||'Festivo'}</span>`:''}
          ${d.special?`<span class="tag special">${d.ausenciaDesc?'Ausencia':'Vacaciones'}</span>`:''}
          ${isOver?`<span class="tag over9">Supera ${cfg.umbralExtra}h</span>`:''}
        </div>
        <div class="detail-chips">
          ${turnoChips}
          <span class="stat-chip${isOver?' over9':''}"><span class="k">Total día</span><span class="v">${fmtH(d.G)}</span></span>
          <span class="stat-chip night"><span class="k">Nocturnas</span><span class="v">${fmtH(d.H)}</span></span>
          <span class="stat-chip"><span class="k">Normales</span><span class="v">${fmtH(d.I)}</span></span>
          <span class="stat-chip extra"><span class="k">Extra</span><span class="v">${fmtH(d.J)}</span></span>
        </div>
      </div>`;
    });
    const diff = weekTotal-40;
    rowsHtml += `<div class="week-label">Semana ${weekNum} <span style="font-weight:500;color:var(--ink-soft);text-transform:none;">— ${weekTotal.toFixed(2).replace('.',',')} h (${diff>=0?'+':''}${diff.toFixed(2).replace('.',',')} h vs 40h)</span></div>`;
    rowsHtml += weekRows || `<p class="hint">Sin registros esta semana.</p>`;
    weekNum++;
  }
  return el(`<div class="card">
    <h3>Detalle diario — ${monthName}</h3>
    <div class="day-list">${rowsHtml}</div>
  </div>`);
}

/* ================= CALCULOS ================= */
function conicGradient(dist){
  let acc = 0;
  const stops = [];
  dist.buckets.forEach(b=>{
    if(b.pct<=0) return;
    const start = acc;
    acc += b.pct;
    stops.push(`${b.color} ${start.toFixed(3)}% ${acc.toFixed(3)}%`);
  });
  if(stops.length===0) return `conic-gradient(var(--rule) 0% 100%)`;
  return `conic-gradient(${stops.join(', ')})`;
}
function renderDistribucionCard(dist, descansos, subtitle){
  const legendHtml = dist.buckets.map(b=>`<div class="dist-row">
    <span class="swatch" style="background:${b.color};"></span>
    <span class="lbl">${b.label}</span>
    <span class="pct">${b.pct.toFixed(1)}%</span>
    <span class="cnt">${b.count} día${b.count===1?'':'s'}</span>
  </div>`).join('');
  const hasViol = descansos && descansos.count>0;
  const descansoHtml = !descansos ? '' : `
    <div class="dist-max descanso${hasViol?' warn':''}"><span>Sin ${STATE.config.descansoMinimo}h entre jornadas</span><b>${descansos.count} de ${descansos.totalTransiciones}</b></div>
    ${hasViol ? `<div class="descanso-list">${descansos.violations.map(v=>`
      <div class="descanso-row">
        <span class="d-dates">${fmtDate(v.finIso)} ${hoursToClock(v.finHora)} → ${fmtDate(v.inicioIso)} ${hoursToClock(v.inicioHora)}</span>
        <span class="d-rest">${v.restH.toFixed(1)} h</span>
      </div>`).join('')}</div>` : ''}
  `;
  return el(`<div class="card">
    <h3>Distribución de jornadas${subtitle?` <span style="font-weight:400;color:var(--ink-soft);">— ${subtitle}</span>`:''}</h3>
    ${dist.total===0 ? `<p class="hint">Sin jornadas registradas todavía.</p>` : `
      <div class="dist-donut-wrap">
        <div class="dist-donut" style="background:${conicGradient(dist)};">
          <div class="dist-donut-hole"><b>${dist.total}</b><span>día${dist.total===1?'':'s'}</span></div>
        </div>
      </div>
      <div class="dist-legend">${legendHtml}</div>
      <div class="dist-max"><span>Jornada máxima alcanzada</span><b>${fmtH(dist.max)}</b></div>
      ${descansoHtml}
    `}
  </div>`);
}
function renderCalculos(){
  const wrap = document.createElement('div');
  wrap.appendChild(renderMonthPills(CALC_MONTH, m=>{ CALC_MONTH=m; renderContent(); }, true));

  if(CALC_MONTH==='Anual'){
    wrap.appendChild(renderResumen());
    return wrap;
  }

  const monthName = CALC_MONTH;
  const cfg = STATE.config;
  const monthData = getMonthData(STATE.year, monthName);
  const calc = calcMonth(STATE.year, monthName);

  wrap.appendChild(el(`<div class="stat-grid cols-4">
     <div class="stat-card"><div class="stat-label">Normales</div><div class="stat-value">${fmtH(calc.totI)}</div></div>
     <div class="stat-card"><div class="stat-label">Nocturnas</div><div class="stat-value">${fmtH(calc.totH)}</div></div>
     <div class="stat-card"><div class="stat-label">Extra</div><div class="stat-value">${fmtH(calc.totJ)}</div></div>
     <div class="stat-card"><div class="stat-label">Total a percibir</div><div class="stat-value accent">${fmtEUR(calc.totalAPercibir)}</div></div>
  </div>`));

  wrap.appendChild(renderDetalleDiario(monthName));

  const festHtml = calc.festivosMes.map(f=>{
    const dcell = monthData.days[f];
    const worked = dcell && ((dcell.M&&dcell.M.entrada)||(dcell.T&&dcell.T.entrada));
    return `<div class="fest-item"><span class="date">${fmtDate(f)}</span><span>${getFestivos(STATE.year).names[f]||''}</span>
      <span class="status ${worked?'trabajado':'libre'}">${worked?'Trabajado':'No trabajado'}</span></div>`;
  }).join('') || `<p class="hint">Sin festivos en este mes.</p>`;

  const pernoctaHtml = (monthData.pernoctas||[]).map(p=>{
    const nights = Math.max(0, Math.round((new Date(p.hasta+'T00:00:00') - new Date(p.desde+'T00:00:00'))/86400000));
    return `<div class="fest-item"><span class="date">${fmtDate(p.desde)} → ${fmtDate(p.hasta)}</span><span>${nights} noche${nights===1?'':'s'}</span>
      <span class="status trabajado">${fmtEUR(nights*calc.precioPernocta)}</span></div>`;
  }).join('') || `<p class="hint">Sin pernoctas en este mes.</p>`;

  const nextM = nextMonthName(monthName);
  const diffPositive = calc.diferencia>=0;
  const moneyCard = el(`<div class="card">
    <h3>Cálculo de importes — ${monthName}</h3>
    <div class="money-grid">
      <div>
        <table class="money">
          <tr><td>Horas extra (${fmtH(calc.totJ)})</td><td>${fmtEUR(calc.importeExtra)}</td></tr>
          <tr><td>Horas nocturnas (${fmtH(calc.totH)})</td><td>${fmtEUR(calc.importeNocturna)}</td></tr>
          <tr class="total"><td>Total a percibir</td><td>${fmtEUR(calc.totalAPercibir)}</td></tr>
        </table>
        <h3 style="margin-top:14px;">Descuento FPN</h3>
        <table class="money">
          <tr><td>Base FPN (${fmtEUR(cfg.fpnBase)} × 70%)</td><td>${fmtEUR(calc.descuentoObjetivo)}</td></tr>
        </table>
        <div class="fpn-result">
          <div class="fpn-box desc"><span>Descontado</span><b>${fmtEUR(calc.descontado)}</b></div>
          <div class="fpn-box sobra"><span>Total a percibir -FPN</span><b>${fmtEUR(calc.totalAPercibirFPN)}</b></div>
        </div>
        <h3 style="margin-top:14px;">Horas abonadas nómina mes vencido <span style="font-weight:400;color:var(--ink-soft);">(nómina de ${nextM})</span></h3>
        <div class="field"><label>Importe abonado (€)</label><input id="calc-abonado" type="number" step="0.01" value="${calc.abonado}"></div>
        <div class="fpn-result">
          <div class="fpn-box desc"><span>Total a percibir -FPN</span><b>${fmtEUR(calc.totalAPercibirFPN)}</b></div>
          <div class="fpn-box sobra"><span>Diferencia</span><b style="color:${diffPositive?'var(--blue-900)':'#B91C1C'};">${fmtEUR(calc.diferencia)}</b></div>
        </div>
        <p class="hint">Importe realmente abonado en la nómina de ${nextM} por las horas de ${monthName}. La diferencia (Total a percibir -FPN menos lo abonado) se calcula sola y también aparece en el resumen anual.</p>
      </div>
      <div>
        <h3>Festivos del mes <span style="font-weight:400;color:var(--ink-soft);">— ${calc.festivosTrabajados} trabajado(s) · ${fmtEUR(calc.importeFestivos)}</span></h3>
        ${festHtml}
        <h3 style="margin-top:14px;">Pernoctas <span style="font-weight:400;color:var(--ink-soft);">— ${calc.pernoctaNoches} noche${calc.pernoctaNoches===1?'':'s'} · ${fmtEUR(calc.importePernocta)}</span></h3>
        ${pernoctaHtml}
      </div>
    </div>
  </div>`);
  wrap.appendChild(moneyCard);
  wrap.appendChild(renderDistribucionCard(calc.distribucion, calc.descansos, monthName));

  setTimeout(()=>{
    const abonadoInput = document.getElementById('calc-abonado');
    if(abonadoInput){
      abonadoInput.addEventListener('change', e=>{
        monthData.abonado = parseFloat(e.target.value)||0;
        queueSave();
        renderContent();
      });
    }
  },0);

  return wrap;
}

function renderResumen(){
  const cfg = STATE.config;
  const wrap = document.createElement('div');
  let sumNormales=0,sumNocturnas=0,sumExtra=0,sumTotales=0;
  let sumFPN=0,sumAbonado=0,sumDiferencia=0;
  let sumFestivos=0,sumImporteFestivos=0,sumNoches=0,sumImportePernocta=0;
  let allGValues = [];
  const rows = getMonthsMeta(STATE.year).map(m=>{
    const c = calcMonth(STATE.year, m.name);
    sumNormales += c.totI; sumNocturnas += c.totH; sumExtra += c.totJ; sumTotales += (c.totI+c.totJ);
    sumFPN += c.totalAPercibirFPN; sumAbonado += c.abonado; sumDiferencia += c.diferencia;
    sumFestivos += c.festivosTrabajados; sumImporteFestivos += c.importeFestivos;
    sumNoches += c.pernoctaNoches; sumImportePernocta += c.importePernocta;
    allGValues = allGValues.concat(c.gValues);
    return {name:m.name, normales:c.totI, nocturnas:c.totH, extra:c.totJ, totales:c.totI+c.totJ, ref:c.ref,
      fpn:c.totalAPercibirFPN, abonado:c.abonado, diferencia:c.diferencia};
  });

  wrap.appendChild(el(`<div class="stat-grid cols-4">
     <div class="stat-card"><div class="stat-label">Horas del año</div><div class="stat-value">${fmtH(sumTotales)}</div><div class="stat-sub">${((sumTotales/cfg.limiteAnual)*100).toFixed(1)}% de ${cfg.limiteAnual}h</div></div>
     <div class="stat-card"><div class="stat-label">Horas extra</div><div class="stat-value">${fmtH(sumExtra)}</div><div class="stat-sub">${((sumExtra/cfg.limiteExtraAnual)*100).toFixed(1)}% de ${cfg.limiteExtraAnual}h</div></div>
     <div class="stat-card"><div class="stat-label">Horas nocturnas</div><div class="stat-value">${fmtH(sumNocturnas)}</div><div class="stat-sub">${sumTotales>0?((sumNocturnas/sumTotales)*100).toFixed(1):'0.0'}% del total</div></div>
     <div class="stat-card"><div class="stat-label">Importe estimado año</div><div class="stat-value accent">${fmtEUR(sumExtra*cfg.precioExtra + sumNocturnas*cfg.precioNocturna)}</div></div>
  </div>`));

  const monthRows = rows.map(r=>`<div class="detail-row">
    <div class="detail-head">${r.name} <span style="font-weight:500;color:var(--ink-soft);">· referencia ${r.ref} h</span></div>
    <div class="detail-chips">
      <span class="stat-chip"><span class="k">Normales</span><span class="v">${fmtH(r.normales)}</span></span>
      <span class="stat-chip night"><span class="k">Nocturnas</span><span class="v">${fmtH(r.nocturnas)}</span></span>
      <span class="stat-chip extra"><span class="k">Extra</span><span class="v">${fmtH(r.extra)}</span></span>
      <span class="stat-chip"><span class="k">Totales</span><span class="v">${fmtH(r.totales)}</span></span>
    </div>
  </div>`).join('');
  const tableCard = el(`<div class="card">
    <h3>Resumen anual de horas</h3>
    <div class="day-list">${monthRows}</div>
    <div class="detail-row" style="border-top:2px solid var(--blue-700);margin-top:4px;">
      <div class="detail-head" style="font-weight:700;color:var(--blue-900);">TOTAL AÑO</div>
      <div class="detail-chips">
        <span class="stat-chip"><span class="k">Normales</span><span class="v">${fmtH(sumNormales)}</span></span>
        <span class="stat-chip night"><span class="k">Nocturnas</span><span class="v">${fmtH(sumNocturnas)}</span></span>
        <span class="stat-chip extra"><span class="k">Extra</span><span class="v">${fmtH(sumExtra)}</span></span>
        <span class="stat-chip"><span class="k">Totales</span><span class="v">${fmtH(sumTotales)}</span></span>
      </div>
    </div>
  </div>`);
  wrap.appendChild(tableCard);

  wrap.appendChild(el(`<div class="stat-grid">
     <div class="stat-card"><div class="stat-label">Total a percibir -FPN (año)</div><div class="stat-value">${fmtEUR(sumFPN)}</div></div>
     <div class="stat-card"><div class="stat-label">Horas abonadas nómina (año)</div><div class="stat-value">${fmtEUR(sumAbonado)}</div></div>
  </div>`));
  wrap.appendChild(el(`<div class="stat-grid">
     <div class="stat-card"><div class="stat-label">Festivos trabajados (año)</div><div class="stat-value">${sumFestivos}</div><div class="stat-sub">${fmtEUR(sumImporteFestivos)}</div></div>
     <div class="stat-card"><div class="stat-label">Pernoctas (año)</div><div class="stat-value">${sumNoches} noche${sumNoches===1?'':'s'}</div><div class="stat-sub">${fmtEUR(sumImportePernocta)}</div></div>
  </div>`));

  const diffRowsHtml = rows.map((r,idx)=>`<tr>
    <td>${r.name}</td>
    <td>${fmtEUR(r.fpn)}</td>
    <td><input type="number" step="0.01" class="resumen-abonado-input" data-month="${r.name}" value="${r.abonado}" style="width:90px;text-align:right;padding:4px 6px;font-size:.8rem;"></td>
    <td style="color:${r.diferencia>=0?'inherit':'#B91C1C'};">${fmtEUR(r.diferencia)}</td>
  </tr>`).join('');
  const diffCard = el(`<div class="card">
    <h3>Diferencia mensual: Total a percibir -FPN vs Horas abonadas</h3>
    <div class="table-wrap">
      <table class="resumen">
        <thead><tr><th>Mes</th><th>Total a percibir -FPN (€)</th><th>Horas abonadas nómina (€)</th><th>Diferencia (€)</th></tr></thead>
        <tbody>
          ${diffRowsHtml}
          <tr class="total-row"><td>TOTAL</td><td>${fmtEUR(sumFPN)}</td><td>${fmtEUR(sumAbonado)}</td><td style="color:${sumDiferencia>=0?'inherit':'#B91C1C'};">${fmtEUR(sumDiferencia)}</td></tr>
        </tbody>
      </table>
    </div>
    <p class="hint">Puedes editar aquí mismo el importe abonado de cualquier mes; se guarda al momento y también se refleja en la pestaña Cálculos de ese mes y en los PDF.</p>
  </div>`);
  wrap.appendChild(diffCard);
  wrap.appendChild(renderDistribucionCard(calcJornadaDist(allGValues), calcDescansosAnual(STATE.year, cfg), `año ${STATE.year}`));

  setTimeout(()=>{
    diffCard.querySelectorAll('.resumen-abonado-input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const monthData = getMonthData(STATE.year, e.target.dataset.month);
        monthData.abonado = parseFloat(e.target.value)||0;
        queueSave();
        renderContent();
      });
    });
  },0);

  const maxRef = Math.max(...rows.map(r=>r.ref));
  const chartRows = rows.map(r=>{
    const pct = Math.min(100, (r.totales/maxRef)*100);
    const over = r.totales > r.ref;
    return `<div class="bar-row">
      <div class="bar-label">${r.name}</div>
      <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="bar-val">${r.totales.toFixed(1)} / ${r.ref} h</div>
    </div>`;
  }).join('');
  const chartCard = el(`<div class="card chart-wrap">
    <h3>Horas totales por mes</h3>
    ${chartRows}
    <div class="bar-row" style="margin-top:12px;">
      <div class="bar-label" style="font-weight:600;">AÑO</div>
      <div class="bar-track"><div class="bar-fill ${sumTotales>cfg.limiteAnual?'over':''}" style="width:${Math.min(100,(sumTotales/cfg.limiteAnual)*100)}%"></div></div>
      <div class="bar-val">${sumTotales.toFixed(1)} / ${cfg.limiteAnual} h</div>
    </div>
  </div>`);
  wrap.appendChild(chartCard);

  return wrap;
}
