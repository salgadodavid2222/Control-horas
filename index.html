async function deliverPDF(doc, filename){
  // 1) Compartir nativo (Android/iOS): abre el menú de "Compartir" del sistema
  //    y desde ahí se puede guardar en Archivos, enviar por WhatsApp, Drive, etc.
  //    Es lo que mejor funciona dentro de una APK/WebView empaquetada.
  try{
    const blob = doc.output('blob');
    if(navigator.share && navigator.canShare){
      const file = new File([blob], filename, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:filename});
          return; // compartido con éxito, no hace falta nada más
        }catch(shareErr){
          if(shareErr && shareErr.name==='AbortError') return; // el usuario canceló el menú, no insistimos
          // si el share falla por otro motivo, seguimos con las alternativas de abajo
        }
      }
    }
  }catch(e){ /* seguimos con las alternativas de abajo */ }

  // 2) Abrir el PDF en una pestaña/ventana nueva (funciona bien en navegadores normales)
  let opened = null;
  try{
    opened = window.open(doc.output('bloburl'), '_blank');
  }catch(e){ opened = null; }
  if(opened) return;

  // 3) Última alternativa: descarga directa
  try{
    doc.save(filename);
  }catch(e){
    alert('No se ha podido generar ni compartir el PDF. Comprueba los permisos de la app (almacenamiento/descargas) y vuelve a intentarlo.');
  }
}

function drawKV(doc, y, title, rows, tableOpts){
  doc.setFontSize(9.5); doc.setFont('helvetica','bold'); doc.setTextColor(11,46,107);
  doc.text(title, 14, y); y += 4.5;
  doc.autoTable(Object.assign({}, tableOpts, {
    startY:y,
    body: rows,
    styles: Object.assign({}, tableOpts.styles, {fontSize:8, cellPadding:1.8}),
    columnStyles: {1:{halign:'right', fontStyle:'bold', textColor:[11,46,107]}}
  }));
  return doc.lastAutoTable.finalY + 5;
}
function dayTableBody(rows, cfg){
  // rows: [{iso, d, monthData}] — como devuelve calcRange, o construido a partir de un mes.
  return rows.map(({iso,d,monthData})=>{
    const cellM = (monthData.days[iso]||{}).M||{};
    const cellT = (monthData.days[iso]||{}).T||{};
    return [
      fmtDate(iso),
      d.special ? '—' : (cellM.entrada||'—')+'–'+(cellM.salida||'—'),
      d.special ? '—' : (cellT.entrada||'—')+'–'+(cellT.salida||'—'),
      d.G.toFixed(2), d.H.toFixed(2), d.I.toFixed(2), d.J.toFixed(2)
    ];
  });
}
function drawDayTable(doc, y, rows, tableOpts, cfg){
  doc.autoTable(Object.assign({}, tableOpts, {
    startY:y,
    head:[['Fecha','Mañana','Tarde','Total (h)','Noct. (h)','Normal (h)','Extra (h)']],
    body: dayTableBody(rows, cfg),
    didParseCell(data){
      if(data.section==='body'){
        const totalVal = parseFloat(data.row.raw[3]);
        if(!isNaN(totalVal) && totalVal > cfg.umbralExtra){
          data.cell.styles.textColor = [185,28,28];
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [254,242,242];
        }
      }
    }
  }));
  return doc.lastAutoTable.finalY + 5;
}

function hexToRgb(hex){
  const v = parseInt(hex.slice(1),16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}
function drawDistribucion(doc, y, dist, tableOpts){
  doc.setFontSize(9.5); doc.setFont('helvetica','bold'); doc.setTextColor(11,46,107);
  doc.text('Distribución de jornadas', 14, y); y += 5;
  if(dist.total===0){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,100,120);
    doc.text('Sin jornadas registradas en este periodo.', 14, y);
    return y+5;
  }
  const cx = 14+20, cy = y+20, r = 18;
  const TWO_PI = Math.PI*2;
  let accPct = 0;
  dist.buckets.forEach(b=>{
    if(b.pct<=0) return;
    const startAng = accPct/100*TWO_PI;
    accPct += b.pct;
    const endAng = accPct/100*TWO_PI;
    const [rr,gg,bb] = hexToRgb(b.color);
    doc.setFillColor(rr,gg,bb);
    const steps = Math.max(1, Math.ceil((endAng-startAng)/(Math.PI/24)));
    let prevX = cx + r*Math.sin(startAng), prevY = cy - r*Math.cos(startAng);
    for(let s=1;s<=steps;s++){
      const t = startAng + (endAng-startAng)*(s/steps);
      const px = cx + r*Math.sin(t), py = cy - r*Math.cos(t);
      doc.triangle(cx,cy, prevX,prevY, px,py, 'F');
      prevX = px; prevY = py;
    }
  });
  doc.setFillColor(255,255,255);
  doc.circle(cx, cy, r*0.55, 'F');
  doc.setDrawColor(220,230,245); doc.setLineWidth(0.3);
  doc.circle(cx, cy, r*0.55, 'S');
  doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(11,46,107);
  doc.text(String(dist.total), cx, cy-0.8, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(6); doc.setTextColor(90,100,120);
  doc.text(dist.total===1?'día':'días', cx, cy+3, {align:'center'});

  const legendX = cx + r + 8;
  const rowColors = dist.buckets.map(b=>hexToRgb(b.color));
  const body = dist.buckets.map(b=>[b.label, `${b.count}`, `${b.pct.toFixed(1)}%`]);
  doc.autoTable(Object.assign({}, tableOpts, {
    startY: y-2,
    margin:{left:legendX, right:14},
    tableWidth: 196-legendX,
    head:[['Rango de jornada','Días','%']],
    body,
    didParseCell(data){
      if(data.section==='body' && data.column.index===0){
        const [rr,gg,bb] = rowColors[data.row.index];
        data.cell.styles.textColor=[rr,gg,bb];
        data.cell.styles.fontStyle='bold';
      }
    }
  }));
  const circleEndY = cy + r + 6;
  y = Math.max(doc.lastAutoTable.finalY, circleEndY) + 3;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(40,48,66);
  doc.text(`Jornada máxima alcanzada: ${dist.max.toFixed(2)} h`, 14, y);
  return y+5.5;
}

function drawDescansos(doc, y, descansos, tableOpts, cfg){
  const hasViol = descansos.count>0;
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
  if(hasViol) doc.setTextColor(185,28,28); else doc.setTextColor(40,48,66);
  doc.text(`Sin ${cfg.descansoMinimo}h entre jornadas: ${descansos.count} de ${descansos.totalTransiciones}`, 14, y);
  y += 4.5;
  if(!hasViol) return y+1;
  const body = descansos.violations.map(v=>[
    `${fmtDate(v.finIso)} ${hoursToClock(v.finHora)}`,
    `${fmtDate(v.inicioIso)} ${hoursToClock(v.inicioHora)}`,
    `${v.restH.toFixed(1)} h`
  ]);
  doc.autoTable(Object.assign({}, tableOpts, {
    startY:y,
    head:[['Fin turno anterior','Inicio turno siguiente','Descanso']],
    body,
    didParseCell(data){
      if(data.section==='body'){ data.cell.styles.textColor=[185,28,28]; }
    }
  }));
  return doc.lastAutoTable.finalY + 5.5;
}

function generatePDF(scope){
  if(!window.jspdf){ alert('No se pudo cargar el generador de PDF. Comprueba tu conexión e inténtalo de nuevo.'); return; }
  try{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const cfg = STATE.config;
  let y = 14;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.setTextColor(11,46,107);
  doc.text('Control de Horas '+STATE.year, 14, y); y+=5.5;
  doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(60,70,90);
  doc.text(`${STATE.employee.nombre||'—'}   -   DNI: ${STATE.employee.dni||'—'}   -   ${STATE.employee.empresa||'—'}   -   CIF: ${STATE.employee.cif||'—'}`, 14, y); y+=6;

  const tableOpts = {
    styles:{fontSize:7, textColor:[15,27,51], cellPadding:1.3, lineColor:[220,230,245], lineWidth:0.1},
    headStyles:{fillColor:[11,46,107], textColor:255, fontSize:7, cellPadding:1.5},
    alternateRowStyles:{fillColor:[240,246,255]},
    margin:{left:14, right:14}
  };

  if(scope==='ANUAL'){
    doc.setFontSize(10.5); doc.setFont('helvetica','bold'); doc.setTextColor(11,46,107);
    doc.text('Informe anual de horas', 14, y); y+=4.5;

    let sumNormales=0,sumNocturnas=0,sumExtra=0,sumTotales=0,sumImporte=0,sumDescontado=0,sumFPN=0,sumAbonado=0,sumDiferencia=0;
    let sumFestivos=0,sumImporteFestivos=0,sumNoches=0,sumImportePernocta=0;
    const monthCalcs = getMonthsMeta(STATE.year).map(m=>({name:m.name, c:calcMonth(STATE.year, m.name)}));
    const body = monthCalcs.map(({name,c})=>{
      sumNormales+=c.totI; sumNocturnas+=c.totH; sumExtra+=c.totJ; sumTotales+=(c.totI+c.totJ);
      sumImporte+=c.totalAPercibir; sumDescontado+=c.descontado;
      sumFPN+=c.totalAPercibirFPN; sumAbonado+=c.abonado; sumDiferencia+=c.diferencia;
      sumFestivos+=c.festivosTrabajados; sumImporteFestivos+=c.importeFestivos;
      sumNoches+=c.pernoctaNoches; sumImportePernocta+=c.importePernocta;
      return [name, c.totI.toFixed(2), c.totH.toFixed(2), c.totJ.toFixed(2), (c.totI+c.totJ).toFixed(2), c.totalAPercibir.toFixed(2)+' €'];
    });
    body.push(['TOTAL', sumNormales.toFixed(2), sumNocturnas.toFixed(2), sumExtra.toFixed(2), sumTotales.toFixed(2), sumImporte.toFixed(2)+' €']);

    doc.autoTable(Object.assign({}, tableOpts, {
      startY:y,
      head:[['Mes','Normales (h)','Nocturnas (h)','Extra (h)','Total (h)','Importe']]
      , body
    }));
    y = doc.lastAutoTable.finalY + 5;

    y = drawKV(doc, y, 'Totales anuales', [
      ['Horas trabajadas', `${sumTotales.toFixed(2)} h  (${((sumTotales/cfg.limiteAnual)*100).toFixed(1)}% de ${cfg.limiteAnual} h)`],
      ['Horas extra', `${sumExtra.toFixed(2)} h  (${((sumExtra/cfg.limiteExtraAnual)*100).toFixed(1)}% de ${cfg.limiteExtraAnual} h)`],
      ['Horas nocturnas', `${sumNocturnas.toFixed(2)} h`],
      ['Importe estimado (extra + nocturnas)', `${sumImporte.toFixed(2)} €`],
      ['Total descontado FPN', `${sumDescontado.toFixed(2)} €`],
      ['Total a percibir -FPN', `${sumFPN.toFixed(2)} €`],
      ['Festivos trabajados', `${sumFestivos} (${sumImporteFestivos.toFixed(2)} €)`],
      ['Pernoctas', `${sumNoches} noche(s) (${sumImportePernocta.toFixed(2)} €)`],
    ], tableOpts);

    let allGValuesYear = [];
    monthCalcs.forEach(({c})=>{ allGValuesYear = allGValuesYear.concat(c.gValues); });
    y = drawDistribucion(doc, y, calcJornadaDist(allGValuesYear), tableOpts);
    y = drawDescansos(doc, y, calcDescansosAnual(STATE.year, cfg), tableOpts, cfg);

    doc.setFontSize(9.5); doc.setFont('helvetica','bold'); doc.setTextColor(11,46,107);
    doc.text('Diferencia mensual: Total a percibir -FPN vs Horas abonadas', 14, y); y+=4.5;
    const diffBody = monthCalcs.map(({name,c})=>[name, c.totalAPercibirFPN.toFixed(2)+' €', c.abonado.toFixed(2)+' €', c.diferencia.toFixed(2)+' €']);
    diffBody.push(['TOTAL', sumFPN.toFixed(2)+' €', sumAbonado.toFixed(2)+' €', sumDiferencia.toFixed(2)+' €']);
    doc.autoTable(Object.assign({}, tableOpts, {
      startY:y,
      head:[['Mes','Total a percibir -FPN','Horas abonadas nómina','Diferencia']]
      , body:diffBody
    }));

    deliverPDF(doc, `Informe_Anual_${STATE.year}.pdf`);
    return;
  }

  // Informe por rango de fechas (sustituye al antiguo informe "mensual")
  const {desde, hasta} = scope;
  const r = calcRange(desde, hasta);

  doc.setFontSize(10.5); doc.setFont('helvetica','bold'); doc.setTextColor(11,46,107);
  doc.text(`Informe — ${fmtDate(desde)} a ${fmtDate(hasta)}`, 14, y); y+=4.5;

  y = drawDayTable(doc, y, r.rows, tableOpts, cfg);

  y = drawKV(doc, y, 'Cálculo de importes', [
    ['Horas extra', `${r.totJ.toFixed(2)} h`],
    ['Importe horas extra', `${r.importeExtra.toFixed(2)} €`],
    ['Horas nocturnas', `${r.totH.toFixed(2)} h`],
    ['Importe horas nocturnas', `${r.importeNocturna.toFixed(2)} €`],
    ['Total a percibir', `${r.totalAPercibir.toFixed(2)} €`],
    ['Festivos trabajados', `${r.festivosTrabajados} (${r.importeFestivos.toFixed(2)} €)`],
    ['Pernoctas', `${r.pernoctaNoches} noche(s) (${r.importePernocta.toFixed(2)} €)`],
  ], tableOpts);

  y = drawDistribucion(doc, y, calcJornadaDist(r.gValues), tableOpts);
  y = drawDescansos(doc, y, r.descansos, tableOpts, cfg);

  doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(90,100,120);
  doc.text('El descuento FPN y la comparativa de horas abonadas se calculan por periodo mensual completo:', 14, y); y+=3.5;
  doc.text('consúltalos en el informe anual o en Cálculos de cada mes.', 14, y);

  deliverPDF(doc, `Informe_${desde}_a_${hasta}.pdf`);
  }catch(e){
    alert('No se ha podido generar el PDF: ' + e.message);
  }
}

/* ================= AJUSTES ================= */
function renderAjustes(){
  const wrap = document.createElement('div');
  const cfg = STATE.config;
  const yearPrices = getYearPrices(STATE.year);

  const yearCard = el(`<div class="card">
    <h3>Año</h3>
    <div id="year-pills-wrap"></div>
    <p class="hint">Cada año tiene su propio calendario de semanas y sus propios registros; cambiar de año no borra los datos de los demás.</p>
  </div>`);
  wrap.appendChild(yearCard);

  const empCard = el(`<div class="card">
    <h3>Datos del trabajador</h3>
    <div class="grid cols-2">
      <div class="field"><label>Nombre y apellidos</label><input id="emp-nombre" type="text" value="${escapeHtml(STATE.employee.nombre)}"></div>
      <div class="field"><label>DNI</label><input id="emp-dni" type="text" value="${escapeHtml(STATE.employee.dni)}"></div>
      <div class="field"><label>Empresa</label><input id="emp-empresa" type="text" value="${escapeHtml(STATE.employee.empresa)}"></div>
      <div class="field"><label>CIF</label><input id="emp-cif" type="text" value="${escapeHtml(STATE.employee.cif)}"></div>
    </div>
  </div>`);
  wrap.appendChild(empCard);

  const cfgCard = el(`<div class="card">
    <h3>Precios, horarios y límites</h3>
    <div class="grid cols-4">
      <div class="field"><label>Inicio noche</label><input id="cfg-nightStart" type="number" min="0" max="23" value="${cfg.nightStart}"></div>
      <div class="field"><label>Fin noche</label><input id="cfg-nightEnd" type="number" min="0" max="23" value="${cfg.nightEnd}"></div>
      <div class="field"><label>Jornada normal (h)</label><input id="cfg-jornadaNormal" type="number" step="0.5" value="${cfg.jornadaNormal}"></div>
      <div class="field"><label>Umbral horas extra (h/día)</label><input id="cfg-umbralExtra" type="number" step="0.5" value="${cfg.umbralExtra}"></div>
      <div class="field"><label>Descanso mínimo entre jornadas (h)</label><input id="cfg-descansoMinimo" type="number" step="0.5" value="${cfg.descansoMinimo}"></div>
      <div class="field"><label>Precio hora normal (€)</label><input id="cfg-precioNormal" type="number" step="0.01" value="${cfg.precioNormal}"></div>
      <div class="field"><label>Precio hora extra (€)</label><input id="cfg-precioExtra" type="number" step="0.01" value="${cfg.precioExtra}"></div>
      <div class="field"><label>Precio hora nocturna (€)</label><input id="cfg-precioNocturna" type="number" step="0.01" value="${cfg.precioNocturna}"></div>
      <div class="field"><label>Precio por festivo ${STATE.year} (€)</label><input id="cfg-precioFestivo" type="number" step="0.01" value="${yearPrices.precioFestivo}"></div>
      <div class="field"><label>Precio pernocta ${STATE.year} (€/noche)</label><input id="cfg-precioPernocta" type="number" step="0.01" value="${yearPrices.precioPernocta}"></div>
      <div class="field"><label>Base descuento FPN (€)</label><input id="cfg-fpnBase" type="number" step="0.01" value="${cfg.fpnBase}"></div>
      <div class="field"><label>Límite anual horas (h)</label><input id="cfg-limiteAnual" type="number" value="${cfg.limiteAnual}"></div>
      <div class="field"><label>Límite anual extra (h)</label><input id="cfg-limiteExtraAnual" type="number" value="${cfg.limiteExtraAnual}"></div>
    </div>
    <p class="hint">La franja nocturna es de "Inicio noche" a "Fin noche" del día siguiente. El umbral marca a partir de cuántas horas por turno se cuenta como hora extra. Las vacaciones, ausencias justificadas y pernoctas se gestionan por mes en la pestaña Registrar. El precio del festivo y de la pernocta son por año: por defecto suben solos (festivo +2€/año, pernocta +5€/año desde 2026), pero si editas el valor de ${STATE.year} aquí, ese año se queda fijo con lo que pongas.</p>
  </div>`);
  wrap.appendChild(cfgCard);

  setTimeout(()=>{
    document.getElementById('year-pills-wrap').appendChild(
      renderYearPills(STATE.year, y=>{
        STATE.year = y;
        SELECTED_DATE = null;
        queueSave();
        const hy = document.getElementById('header-year');
        if(hy) hy.textContent = STATE.year;
        renderContent();
      })
    );
    const map = {'emp-nombre':['employee','nombre'],'emp-dni':['employee','dni'],'emp-empresa':['employee','empresa'],'emp-cif':['employee','cif']};
    Object.keys(map).forEach(id=>{
      document.getElementById(id).addEventListener('input', e=>{
        STATE[map[id][0]][map[id][1]] = e.target.value; queueSave();
        if(id==='emp-nombre') updateHeaderName();
      });
    });
    const cfgMap = ['nightStart','nightEnd','jornadaNormal','umbralExtra','descansoMinimo','precioNormal','precioExtra','precioNocturna','fpnBase','limiteAnual','limiteExtraAnual'];
    cfgMap.forEach(k=>{
      document.getElementById('cfg-'+k).addEventListener('input', e=>{
        STATE.config[k] = parseFloat(e.target.value)||0; queueSave();
      });
    });
    ['precioFestivo','precioPernocta'].forEach(k=>{
      document.getElementById('cfg-'+k).addEventListener('input', e=>{
        setYearPrice(STATE.year, k, parseFloat(e.target.value)||0);
        queueSave();
      });
    });
  },0);

  return wrap;
}

/* ============ ARRANQUE ============ */
function monthContainingToday(year){
  const t = todayISO();
  const meta = getMonthsMeta(year);
  const found = meta.find(m=>genDays(m).includes(t));
  return found ? found.name : meta[0].name;
}
(async function init(){
  await loadState();
  const mToday = monthContainingToday(STATE.year);
  ACTIVE_MONTH = mToday;
  CALC_MONTH = mToday;
  SELECTED_DATE = todayISO();
  renderApp();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* no crítico si falla */ });
  });
}
</script>
